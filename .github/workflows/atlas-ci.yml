name: Atlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published advisories are noticed even without a push.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify JavaScript-only repository
        run: npm run verify:js

      - name: Verify dataset
        run: npm run verify:data

      - name: Unit and route tests
        run: npm test

      - name: Production build
        run: npm run build

  # Kept separate so a new upstream advisory does not block unrelated pull
  # requests, but it still shows up as a red check to act on.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Audit production dependencies
        run: npm run audit:prod
